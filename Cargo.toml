[package]
name = "ai-agent"
version = "0.1.0"
edition = "2024"

[[example]]
name = "stream_chat"
path = "examples/stream_chat.rs"

[[example]]
name = "tool_call_complete"
path = "examples/tool_call_complete.rs"

[dependencies]
anyhow = "1.0.102"
async-openai = { version = "0.41.0", features = ["chat-completion", "embedding"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
backon = "1.6.0"
base64 = "0.23.1"
chrono = "0.4.45"
csv = "1.4.0"
dotenvy = "0.15.7"
futures = "0.3.34"
rmcp = { version = "3.1.3", features = ["client", "server", "macros", "transport-child-process", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiktoken-rs = "0.12.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.1", features = ["v4"] }
zip = "8.6.0"
